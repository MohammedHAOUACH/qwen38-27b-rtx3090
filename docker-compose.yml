# Qwen3.8-27B on one RTX 3090, containerized. See docs/docker.md.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # just download + requantize the model
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL, VISION,
# SPEC_ATTN, DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the
# container. Fastest single-user decode, if the card is yours alone (README,
# "If you are the only user"; the drafter it needs is already downloaded by
# prepare):
#
#   printf 'SPEC=dflash2\nDFLASH_TOKENS=15\nPREFIX_CACHE=1\n' >> .env
#
# On WSL2 add VLLM_WSL2_ENABLE_PIN_MEMORY=1 to that .env: SPEC=dflash2 forces vLLM's
# V2 model runner, whose UVA buffers are refused there by default, and the container
# aborts at "RuntimeError: UVA is not available" before loading weights (docs/docker.md).
# PORT and MODELS_DIR are read here: models live in ./models by default
# (the same layout as the venv install, so both can share one download).
# One GPU: run either "single" or "batch", not both.

x-qwen: &qwen
  image: qwen38-27b-3090:latest
  build: .
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    PORT: ${PORT:-1234}
    # Qwen 3.8 supports up to 262144 tokens; override with MAX_LEN in .env if needed.
    MAX_LEN: ${MAX_LEN:-262144}
    # Keep the multimodal vision tower loaded for image inputs. CPU offload is
    # required by default on a 24 GB card to leave room for the language model.
    VISION: ${VISION:-1}
    VISION_OFFLOAD: ${VISION_OFFLOAD:-1}
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache

x-serve: &serve
  <<: *qwen
  restart: unless-stopped
  ports:
    - "${PORT:-1234}:${PORT:-1234}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          # Two GPUs for --tensor-parallel-size 2 (set EXTRA_ARGS in .env).
          - driver: nvidia
            count: 2
            capabilities: [gpu]
  stop_grace_period: 30s
  stop_signal: SIGTERM
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-1234}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

volumes:
  qwen-cache:
